{% extends "base.html" %}
{% block title %}Login – GeoIP Dashboard{% endblock %}

{% block auth_content %}
<div class="w-full max-w-md">
  <!-- Logo -->
  <div class="text-center mb-8">
    <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 rounded-2xl shadow-lg mb-4">
      <i class="fa-solid fa-globe text-white text-2xl"></i>
    </div>
    <h1 class="text-2xl font-bold text-gray-900">GeoIP Dashboard</h1>
    <p class="text-gray-500 text-sm mt-1">Sign in to manage your API tokens</p>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
    {% if error %}
    <div class="mb-4 bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-3 text-sm flex items-center gap-2">
      <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
    </div>
    {% endif %}
    {% if success %}
    <div class="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-lg px-4 py-3 text-sm flex items-center gap-2">
      <i class="fa-solid fa-circle-check"></i> {{ success }}
    </div>
    {% endif %}

    <form method="post" action="/dashboard/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required placeholder="you@example.com"
               class="input" autocomplete="email" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
               class="input" autocomplete="current-password" />
      </div>
      <button type="submit" class="w-full btn-primary py-2.5 text-base">
        <i class="fa-solid fa-right-to-bracket mr-2"></i>Sign In
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-6">
      Don't have an account?
      <a href="/dashboard/register" class="text-indigo-600 font-medium hover:underline">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
